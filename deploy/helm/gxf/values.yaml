# Default values for the gxf chart. Override with `-f my-values.yaml` or `--set`.

# Container image registry and tag used for all GXF platform images.
image:
  registry: ghcr.io/osgp
  tag: latest
  pullPolicy: IfNotPresent

# Database configuration. Non-secret values live in the ConfigMap-rendered global.properties;
# the password is stored in a Kubernetes Secret and injected as the DB_PASSWORD env var
# (Spring relaxed binding resolves ${db.password} from it).
database:
  host: gxf-postgres
  port: 5432
  username: osp_admin
  # For demo/dev only. In real environments provide via `--set database.password=...`,
  # an existing Secret, or a sealed-secret / external secret operator.
  password: "1234"
  # Databases created by the Postgres init container.
  databases:
    - osgp_core
    - osgp_adapter_ws_tariffswitching
    - osgp_adapter_domain_tariffswitching

# JMS broker (ActiveMQ Artemis).
artemis:
  image: apache/activemq-artemis:2.42.0
  user: admin
  password: "admin"
  brokerUrl: "failover:(tcp://gxf-artemis:61616)"

postgres:
  image: postgres:16
  storage: 1Gi

# Platform services. Each converted service exposes Spring Boot Actuator liveness/readiness probes.
services:
  osgpCore:
    enabled: true
    name: osgp-core
    image: osgp-core
    httpPort: 8080
    managementPort: 8080
  adapterWsTariffswitching:
    enabled: true
    name: osgp-adapter-ws-tariffswitching
    image: osgp-adapter-ws-tariffswitching
    httpPort: 8080
    # The SOAP servlet is mapped to /*, so Actuator runs on a dedicated management port.
    managementPort: 8081
  adapterDomainTariffswitching:
    enabled: true
    name: osgp-adapter-domain-tariffswitching
    image: osgp-adapter-domain-tariffswitching
    httpPort: 8080
    managementPort: 8080

# A representative protocol adapter and its device simulator. These are not part of the WS6 Spring
# Boot conversion; they are deployed from their existing images to complete an end-to-end stack.
protocol:
  adapterOslp:
    enabled: true
    name: osgp-protocol-adapter-oslp
    image: osgp-protocol-adapter-oslp
    httpPort: 8080
  webDeviceSimulator:
    enabled: true
    name: osgp-web-device-simulator
    image: osgp-web-device-simulator
    httpPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

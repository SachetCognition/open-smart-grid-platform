{{/*
SPDX-FileCopyrightText: Contributors to the GXF project

SPDX-License-Identifier: Apache-2.0

A representative protocol adapter (OSLP) and its device simulator, completing an end-to-end stack.
These images are deployed as-is (they are not part of the WS6 Spring Boot conversion), so their
health checks fall back to a TCP check rather than an Actuator probe.
*/}}
{{- range $key, $svc := (dict "adapterOslp" .Values.protocol.adapterOslp "webDeviceSimulator" .Values.protocol.webDeviceSimulator) }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  labels:
    app: {{ $svc.name }}
    {{- include "gxf.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $svc.name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
    spec:
      containers:
        - name: {{ $svc.name }}
          image: {{ include "gxf.image" (dict "root" $ "image" $svc.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.httpPort }}
              name: http
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-db-credentials
                  key: DB_PASSWORD
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-db-credentials
                  key: ARTEMIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: {{ $svc.httpPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - name: global-config
              mountPath: /etc/osgp
              readOnly: true
      volumes:
        - name: global-config
          configMap:
            name: {{ $.Release.Name }}-global-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "gxf.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ $svc.name }}
  ports:
    - port: {{ $svc.httpPort }}
      targetPort: {{ $svc.httpPort }}
      name: http
{{- end }}
{{- end }}

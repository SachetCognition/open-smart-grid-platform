apiVersion: apps/v1
kind: Deployment
metadata:
  name: gxf-artemis
  labels:
    app: gxf-artemis
    {{- include "gxf.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gxf-artemis
  template:
    metadata:
      labels:
        app: gxf-artemis
    spec:
      containers:
        - name: artemis
          image: {{ .Values.artemis.image }}
          ports:
            - containerPort: 61616
              name: core
            - containerPort: 8161
              name: console
          env:
            - name: ARTEMIS_USER
              value: {{ .Values.artemis.user | quote }}
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-credentials
                  key: ARTEMIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 61616
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gxf-artemis
  labels:
    {{- include "gxf.labels" . | nindent 4 }}
spec:
  selector:
    app: gxf-artemis
  ports:
    - port: 61616
      targetPort: 61616
      name: core
    - port: 8161
      targetPort: 8161
      name: console

# WS6: Cloud-native configuration for the osgp-adapter-domain-tariffswitching Spring Boot
# application. The Tomcat context.xml JNDI <Environment> entries that pointed the application at its
# external configuration files have been replaced by the properties below. In Kubernetes the actual
# configuration content is supplied through a ConfigMap (mounted global.properties) and a Secret
# (database credentials) - see deploy/. Values can be overridden with environment variables.

server:
  port: 8080

spring:
  application:
    name: osgp-adapter-domain-tariffswitching
  config:
    import:
      - optional:file:/etc/osgp/global.properties
      - optional:file:/etc/osgp/osgp-adapter-domain-tariffswitching.properties

# Location of the file-system config files referenced by the @PropertySource annotations. These
# used to be provided as Tomcat JNDI Environment entries in context.xml.
osgp/Global/config: /etc/osgp/global.properties
osgp/AdapterDomainTariffSwitching/config: /etc/osgp/osgp-adapter-domain-tariffswitching.properties

logging:
  config: classpath:logback-config.xml

# Spring Boot Actuator: Kubernetes-style liveness and readiness probes at
# /actuator/health/liveness and /actuator/health/readiness, plus a Prometheus endpoint.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
